services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: gym_api

    ports:
      - "8000:8000"

    command: [
      "uv",
      "run",
      "--locked",
      "uvicorn",
      "main:app",
      "--host",
      "0.0.0.0",
      "--port",
      "8000",
      "--reload"
    ]

    volumes:
      - .:/app
      - app_venv:/app/.venv

    env_file:
      - .env

    environment:
      WATCHFILES_FORCE_POLLING: "true"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    container_name: gym_postgres

    ports:
      - "5433:5432"

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_venv:
